name: Rapatrier les images générées
# Contournement : l'environnement Claude Code n'a pas accès au domaine
# d'hébergement temporaire des médias générés ; ce workflow les télécharge
# depuis un runner GitHub et les committe sur la branche ciblée par le dispatch.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  rapatrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger et compresser la vidéo du héros
        run: |
          set -euo pipefail
          mkdir -p site/public/videos
          curl -fSL --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36' \
            -H 'Accept: video/mp4,video/*;q=0.9,*/*;q=0.8' \
            -o /tmp/hero-brut.mp4 \
            'https://mcp.bensaid-mcp.com/files/videos/veo/c8bcc55bc97b21f6b5804bff6c9b8a08/veo-1787938313994.mp4'
          ffmpeg -y -i /tmp/hero-brut.mp4 -an -vf scale=1280:-2 -c:v libx264 -crf 28 -preset slow -movflags +faststart site/public/videos/accueil-hero.mp4
          ls -la site/public/videos/
      - name: Committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public/videos
          git commit -m "Vidéo du héros : rapatriement automatique"
          git push
