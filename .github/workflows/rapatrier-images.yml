name: Rapatrier les images générées
# Contournement : l'environnement Claude Code n'a pas accès au domaine
# d'hébergement temporaire des images générées ; ce workflow lit le manifeste
# livrables/portrait-2026/a-rapatrier.txt (lignes « nom<TAB>url »), télécharge
# chaque image depuis un runner GitHub et la committe sur la branche ciblée
# par le dispatch.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  rapatrier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow requests
      - name: Télécharger les images du manifeste
        shell: python
        run: |
          import io, pathlib
          import requests
          from PIL import Image

          manifeste = pathlib.Path('livrables/portrait-2026/a-rapatrier.txt')
          dossier = manifeste.parent
          for ligne in manifeste.read_text(encoding='utf-8').splitlines():
              ligne = ligne.strip()
              if not ligne or ligne.startswith('#'):
                  continue
              nom, url = [c.strip() for c in ligne.split(None, 1)]
              reponse = requests.get(url, timeout=180)
              reponse.raise_for_status()
              img = Image.open(io.BytesIO(reponse.content)).convert('RGB')
              img.save(dossier / f'{nom}.jpg', 'JPEG', quality=95, optimize=True, progressive=True)
              apercu = img.copy()
              apercu.thumbnail((900, 900), Image.LANCZOS)
              apercu.save(dossier / f'{nom}-apercu.jpg', 'JPEG', quality=88, optimize=True, progressive=True)
              print(f'{nom} : {img.size} -> aperçu {apercu.size}')
      - name: Committer les images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livrables/portrait-2026
          git commit -m "Portraits générés : rapatriement automatique" || echo "rien à committer"
          git push
