name: Déployer sur Cloudflare Pages
# Déploie le site à chaque push sur la branche, dès que les deux secrets
# CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID existent dans le dépôt
# (Settings → Secrets and variables → Actions). Sans eux, le workflow
# s'arrête proprement sans erreur.
on:
  push:
    branches: [claude/taxesalaire-redesign-wqwxfm]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Vérifier les secrets
        id: garde
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "pret=non" >> "$GITHUB_OUTPUT"
            echo "Secrets Cloudflare absents : déploiement ignoré (voir site/DEPLOIEMENT.md)."
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.garde.outputs.pret == 'oui'
      - uses: actions/setup-node@v4
        if: steps.garde.outputs.pret == 'oui'
        with:
          node-version: 20
      - name: Construire le site
        if: steps.garde.outputs.pret == 'oui'
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Créer le projet Pages (première fois uniquement)
        if: steps.garde.outputs.pret == 'oui'
        working-directory: site
        run: npx wrangler pages project create taxesalaire --production-branch=claude/taxesalaire-redesign-wqwxfm || echo "Projet déjà existant."
      - name: Déployer
        if: steps.garde.outputs.pret == 'oui'
        working-directory: site
        run: npx wrangler pages deploy dist --project-name=taxesalaire --branch=claude/taxesalaire-redesign-wqwxfm
